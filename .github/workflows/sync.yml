name: NHL Calendar Sync

on:
  workflow_dispatch:   # allows manual run
  schedule:
    - cron: "0 */2 * * *"  # runs every 6 hours (adjust if needed)
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug sync.py (show line numbers)
        run: nl -ba sync.py | sed -n '35,50p'

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Write Google service account key to file
      - name: Write Google credentials file
        run: |
          echo '${{ secrets.GCP_KEY }}' > key.json

      # 5. Run your script
      - name: Run sync script
        run: python sync.py
